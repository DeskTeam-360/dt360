name: CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Lint and build
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    name: Deploy production (main)
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-server-main
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            git remote -v
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            npm ci
            npm run build
            if command -v pm2 >/dev/null 2>&1; then
              pm2 restart dt360 || pm2 start npm --name dt360 -- run start
            else
              echo "PM2 not found. Start the app manually, e.g.: nohup npm run start -- -p 3000 &"
            fi
            # P1: www.deskteam360.com → https://deskteam360.com (path+query). Needs passwordless sudo.
            chmod +x scripts/apply-www-apex-redirect.sh
            bash scripts/apply-www-apex-redirect.sh
      - name: Verify public www→apex redirect
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (compatible; DT360-CI/1.0)'
          fail=0
          check() {
            local url="$1" expect_loc="$2"
            echo "Checking $url"
            headers="$(curl -sI -A "$UA" --max-redirs 0 --connect-timeout 20 "$url" || true)"
            printf '%s\n' "$headers" | tr -d '\r' | head -15
            code="$(printf '%s\n' "$headers" | awk 'NR==1{print $2}')"
            loc="$(printf '%s\n' "$headers" | tr -d '\r' | awk 'BEGIN{IGNORECASE=1} /^location:/{print $2; exit}')"
            case "${code:-}" in
              301|308)
                if [[ "${loc:-}" != "$expect_loc" ]]; then
                  echo "ERROR: expected Location $expect_loc got ${loc:-none}" >&2
                  fail=1
                fi
                ;;
              *)
                echo "ERROR: expected 301/308 from www, got ${code:-err}" >&2
                fail=1
                ;;
            esac
          }
          check 'https://www.deskteam360.com/' 'https://deskteam360.com/'
          check 'http://www.deskteam360.com/' 'https://deskteam360.com/'
          check 'https://www.deskteam360.com/blog/what-is-insourcing?x=1' 'https://deskteam360.com/blog/what-is-insourcing?x=1'
          check 'http://www.deskteam360.com/blog/what-is-insourcing?x=1' 'https://deskteam360.com/blog/what-is-insourcing?x=1'
          apex="$(curl -sI -A "$UA" --max-redirs 0 --connect-timeout 20 https://deskteam360.com/ | awk 'NR==1{print $2}')"
          echo "Apex status: $apex"
          [[ "$apex" == "200" ]] || { echo "ERROR: apex must stay 200" >&2; fail=1; }
          # Confirm final page after one hop
          final="$(curl -sI -A "$UA" -L --max-redirs 3 -o /dev/null -w '%{http_code} %{url_effective} %{num_redirects}' https://www.deskteam360.com/blog/what-is-insourcing?x=1)"
          echo "Follow www blog: $final"
          echo "$final" | grep -q '^200 https://deskteam360.com/blog/what-is-insourcing?x=1 1$' || {
            echo "ERROR: expected one hop to apex blog 200" >&2
            fail=1
          }
          exit "$fail"

  deploy-staging:
    name: Deploy staging (dev)
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-server-dev
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH_STAGING }}"
            git remote -v
            git fetch origin dev
            git checkout dev
            git reset --hard origin/dev
            npm ci
            npm run build
            if command -v pm2 >/dev/null 2>&1; then
              pm2 restart dt360-staging || pm2 start npm --name dt360-staging -- run start -- -p 3001
            else
              echo "PM2 not found. Start the app manually, e.g.: nohup npm run start -- -p 3001 &"
            fi
